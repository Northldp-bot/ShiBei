name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -project ShiBei.xcodeproj -list

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShiBei.xcodeproj \
            -scheme ShiBei \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiBei.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: Print build errors
        if: failure()
        run: |
          echo "===== error lines ====="
          grep -n "error:" build.log | head -80 || true
          echo "===== tail ====="
          tail -n 80 build.log || true

      - name: Package IPA
        if: success()
        run: |
          mkdir -p build/Payload
          cp -R build/ShiBei.xcarchive/Products/Applications/ShiBei.app build/Payload/
          cd build
          zip -qry ShiBei.ipa Payload
          ls -lh ShiBei.ipa
          shasum -a 256 ShiBei.ipa > ShiBei.ipa.sha256
          cat ShiBei.ipa.sha256

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiBei-ipa
          path: |
            build/ShiBei.ipa
            build/ShiBei.ipa.sha256
          retention-days: 30
