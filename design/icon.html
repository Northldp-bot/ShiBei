<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;background:#0B0B0C;}
  .wrap{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:
      radial-gradient(70% 55% at 26% 18%, rgba(214,168,110,.38) 0%, rgba(214,168,110,0) 62%),
      radial-gradient(80% 70% at 82% 92%, rgba(90,110,150,.28) 0%, rgba(90,110,150,0) 60%),
      linear-gradient(160deg,#17171A 0%,#0B0B0C 58%,#08080A 100%);}
  .ring{position:absolute;width:660px;height:660px;left:182px;top:182px;border-radius:50%;
    border:1px solid rgba(255,255,255,.10);}
  .ring2{position:absolute;width:760px;height:760px;left:132px;top:132px;border-radius:50%;
    border:1px solid rgba(255,255,255,.05);}
  .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-size:520px;line-height:1;color:#F6F1E7;font-weight:600;
    text-shadow:0 24px 80px rgba(0,0,0,.55);}
  .en{position:absolute;left:0;right:0;bottom:196px;text-align:center;
    font-family:-apple-system,"Segoe UI",sans-serif;font-size:34px;letter-spacing:18px;
    color:rgba(246,241,231,.42);font-weight:600;padding-left:18px;}
</style></head><body>
<div class="wrap">
  <div class="ring2"></div>
  <div class="ring"></div>
  <div class="glyph">拾</div>
  <div class="en">SHIBEI</div>
</div>
</body></html>
